name: Fork GitHub Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: avrea-ubuntu-latest-2-vcpu
            rust_target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu.2.28
            binary: agent-browser-linux-x64
            use_zigbuild: true
          - name: macOS ARM64
            # A native macOS runner supplies the Apple SDK and can smoke-test the binary.
            os: avrea-macos-26-8-vcpu
            rust_target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version
        run: pnpm run version:sync

      - name: Build dashboard
        run: pnpm --filter dashboard build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: |
          pip3 install ziglang==0.16.0
          cargo install cargo-zigbuild --version 0.22.3 --locked

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        run: cargo zigbuild --locked --release --manifest-path cli/Cargo.toml --target ${{ matrix.build_target }}

      - name: Build with cargo
        if: '!matrix.use_zigbuild'
        run: cargo build --locked --release --manifest-path cli/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Copy binary
        run: |
          mkdir -p artifacts
          cp cli/target/${{ matrix.rust_target }}/release/agent-browser artifacts/${{ matrix.binary }}
          chmod +x artifacts/${{ matrix.binary }}

      - name: Verify binary version
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          ACTUAL_VERSION=$(artifacts/${{ matrix.binary }} --version)
          echo "$ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "agent-browser $EXPECTED_VERSION"

      - name: Verify Linux GNU glibc floor
        if: matrix.binary == 'agent-browser-linux-x64'
        run: |
          set -euo pipefail
          if objdump -p artifacts/${{ matrix.binary }} | grep -E 'GLIBC_2\.([3-9][0-9]|29)'; then
            echo "ERROR: ${{ matrix.binary }} requires glibc newer than 2.28"
            exit 1
          fi
          objdump -p artifacts/${{ matrix.binary }} | sed -n '/Version References:/,$p'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: [version, build-binaries]
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: agent-browser-*
          merge-multiple: true

      - name: Verify binaries exist
        run: |
          for binary in agent-browser-linux-x64 agent-browser-darwin-arm64; do
            if [ ! -s "artifacts/$binary" ]; then
              echo "Error: Missing or empty release binary: $binary"
              exit 1
            fi
            chmod +x "artifacts/$binary"
          done

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          Fork release with prebuilt binaries for in-parallel-oy/agent-browser.

          Includes upstream agent-browser plus the fork recording changes, for Linux x64 and macOS ARM64.

          Install from the fork without compiling:

          ```bash
          pnpm add --global github:in-parallel-oy/agent-browser
          ```
          EOF

      - name: Create GitHub Release
        run: |
          BINARIES=(artifacts/agent-browser-linux-x64 artifacts/agent-browser-darwin-arm64)

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" "${BINARIES[@]}" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              "${BINARIES[@]}"
          fi
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
